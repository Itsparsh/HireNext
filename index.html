<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <title>HireNext</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        fetch('http://localhost:9999/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'error', msg, url, lineNo, columnNo, stack: error ? error.stack : '' })
        }).catch(()=>console.error('logger failed'));
        return false;
      };
      window.onunhandledrejection = function(event) {
        fetch('http://localhost:9999/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'unhandledrejection', reason: event.reason ? event.reason.toString() : 'unknown' })
        }).catch(()=>console.error('logger failed'));
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
